<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskMaster</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones para o botão de mostrar senha -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Bem-vindo de volta!</h2>
                <p>Acesse sua conta para continuar.</p>
            </div>
            
            <form id="formLogin">
                <div id="mensagemErro" class="alert-error hidden"></div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="password-container">
                        <input type="password" id="senha" placeholder="••••••••" required>
                        <button type="button" class="btn-icon" id="btnToggle">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" id="btnEntrar" class="btn-primary">
                    <span class="btn-text">Entrar na Conta</span>
                </button>

                <p class="auth-footer">
                    Novo por aqui? <a href="../Cadastro/cadastro.html">Crie uma conta</a>
                </p>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
